name: OpenFaders

options:
  bundleIdPrefix: app.openfaders
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # The build signs ad-hoc ("-") so contributors without the maintainer's
    # certificate can still compile. Ad-hoc will NOT load, though: coreaudiod's
    # AMFI check rejects ad-hoc signatures (error -423) and requires a recognized
    # developer certificate chain. Notarization is NOT required to load locally.
    # The dev reload script (Scripts/reload-driver.sh) re-signs with a Developer
    # ID before installing; the packaging pipeline signs and notarizes to ship.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  # The virtual audio driver: a Core Audio AudioServerPlugIn packaged as a
  # `.driver` bundle installed into /Library/Audio/Plug-Ins/HAL. Pure C, no Swift.
  OpenFadersDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/OpenFadersDriver
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: OpenFadersDriver
        PRODUCT_BUNDLE_IDENTIFIER: app.openfaders.driver
        INFOPLIST_FILE: Sources/OpenFadersDriver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: driver
        MACH_O_TYPE: mh_bundle
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  # Phase 1 command-line routing tool. Captures each virtual device's mirrored
  # input and plays it into a channel pair of the physical multitrack output.
  # This is a diagnostic and proof-of-concept tool; Phase 2 moves the engine
  # into a shared library used by the menu-bar app.
  OpenFadersRoute:
    type: tool
    platform: macOS
    sources:
      - path: Sources/OpenFadersRoute
    settings:
      base:
        PRODUCT_NAME: openfaders-route
        PRODUCT_BUNDLE_IDENTIFIER: app.openfaders.route
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
