name: OpenFaders

options:
  bundleIdPrefix: app.openfaders
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    # The build signs ad-hoc ("-") so contributors without the maintainer's
    # certificate can still compile. Ad-hoc will NOT load, though: coreaudiod's
    # AMFI check rejects ad-hoc signatures (error -423) and requires a recognized
    # developer certificate chain. Notarization is NOT required to load locally.
    # The dev reload script (Scripts/reload-driver.sh) re-signs with a Developer
    # ID before installing; the packaging pipeline signs and notarizes to ship.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  # The virtual audio driver: a Core Audio AudioServerPlugIn packaged as a
  # `.driver` bundle installed into /Library/Audio/Plug-Ins/HAL. Pure C, no Swift.
  OpenFadersDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Sources/OpenFadersDriver
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_NAME: OpenFadersDriver
        PRODUCT_BUNDLE_IDENTIFIER: app.openfaders.driver
        INFOPLIST_FILE: Sources/OpenFadersDriver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: driver
        MACH_O_TYPE: mh_bundle
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
    dependencies:
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  # The routing engine as a reusable static library. The command-line tool and
  # the menu-bar app both link it, so the real-time core lives in exactly one
  # place. Pure C; the audio units it builds run in the linking process (in the
  # app, that means the app owns the microphone/audio-input permission).
  OpenFadersEngine:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/OpenFadersEngine
    settings:
      base:
        PRODUCT_NAME: OpenFadersEngine
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        SKIP_INSTALL: YES
    dependencies:
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  # Command-line routing tool. Captures each virtual device's mirrored input and
  # plays it into a channel pair of the physical multitrack output. A diagnostic
  # and proof-of-concept front end over the shared engine library.
  OpenFadersRoute:
    type: tool
    platform: macOS
    sources:
      - path: Sources/OpenFadersRoute
    settings:
      base:
        PRODUCT_NAME: openfaders-route
        PRODUCT_BUNDLE_IDENTIFIER: app.openfaders.route
        CLANG_ENABLE_OBJC_ARC: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/OpenFadersEngine
    dependencies:
      - target: OpenFadersEngine
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework

  # The menu-bar app: a SwiftUI accessory that runs the engine in-process and
  # gives it a native control surface. Targets macOS 14 for the Observation
  # framework (@Observable) and SettingsLink. Builds ad-hoc for development; the
  # release pipeline re-signs it with a Developer ID and the hardened runtime.
  OpenFadersApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/OpenFadersApp
        excludes:
          - "Support/Info.plist"
          - "Support/OpenFaders.entitlements"
    settings:
      base:
        PRODUCT_NAME: OpenFaders
        PRODUCT_BUNDLE_IDENTIFIER: app.openfaders.app
        INFOPLIST_FILE: Sources/OpenFadersApp/Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Sources/OpenFadersApp/Support/OpenFaders.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/OpenFadersApp/Support/OpenFaders-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/OpenFadersEngine
    dependencies:
      - target: OpenFadersEngine
      # Ship the driver inside the app (Contents/SharedSupport) and re-sign it on
      # copy, so the app can install it into the system HAL directory itself,
      # without the user ever touching the command line.
      - target: OpenFadersDriver
        link: false
        embed: true
        codeSign: true
        copy:
          destination: sharedSupport
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: CoreFoundation.framework
      - sdk: ServiceManagement.framework
