<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Main diagonal gradient: vivid blue -> violet -> pink -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#4F6BFF"/>
      <stop offset="0.52" stop-color="#7B4DFF"/>
      <stop offset="1"   stop-color="#FF4D8D"/>
    </linearGradient>

    <!-- Soft light coming from the top for a glassy, dimensional feel -->
    <radialGradient id="topHighlight" cx="0.5" cy="0.12" r="0.9">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Gentle darkening toward the bottom for depth -->
    <linearGradient id="bottomShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#0A0620" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Drop shadow that seats the tile on its surface, macOS style -->
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1A1030" flood-opacity="0.30"/>
    </filter>

    <!-- Subtle shadow under the white bars so they lift off the gradient -->
    <filter id="barShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#2A0E3A" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824x824 tile, 100px side margins, 90 top / 110 bottom -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="90" width="824" height="824" rx="185.4" fill="url(#bg)"/>
    <rect x="100" y="90" width="824" height="824" rx="185.4" fill="url(#topHighlight)"/>
    <rect x="100" y="90" width="824" height="824" rx="185.4" fill="url(#bottomShade)"/>
    <!-- Hairline inner edge to crisp the rim -->
    <rect x="100.75" y="90.75" width="822.5" height="822.5" rx="184.65"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
  </g>

  <!-- Waveform: 7 slender rounded bars following the SF "waveform" rhythm.
       Short stub left, a rising run into the tall centre bar, a dip just after
       centre, tall again, then short on the right. Centre-aligned on y=502. -->
  <g stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" filter="url(#barShadow)">
    <line x1="302" y1="423.0" x2="302" y2="581.0"/>
    <line x1="372" y1="356.4" x2="372" y2="647.6"/>
    <line x1="442" y1="331.4" x2="442" y2="672.6"/>
    <line x1="512" y1="294.0" x2="512" y2="710.0"/>
    <line x1="582" y1="389.7" x2="582" y2="614.3"/>
    <line x1="652" y1="339.8" x2="652" y2="664.2"/>
    <line x1="722" y1="406.3" x2="722" y2="597.7"/>
  </g>
</svg>
